<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Requests · SunkenBot</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111827;--panel2:#0d1422;--line:#253249;--text:#e5edf8;--muted:#8d9bb0;--blue:#4f8cff;--green:#36d399;--red:#f27791;--yellow:#f5c75b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172238 0,#090d16 58%);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:850px;margin:auto;padding:28px 15px 60px}.hidden{display:none!important}.panel{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 42px #0003}.gate{max-width:360px;margin:12vh auto 0;padding:24px}h1{font-size:23px;margin:0 0 4px}h2{font-size:16px;margin:0}.muted{color:var(--muted);font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs{border-bottom:1px solid var(--line);padding:0 2px;margin-bottom:14px}.tab{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:10px 12px}.tab.active{border-color:var(--blue);color:var(--text)}button,input{font:inherit}button{border:1px solid #35445c;background:#17243a;color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:650}button:hover{border-color:#5b78a5}button.primary{background:#245ec8;border-color:#4f8cff}button.good{color:#a7f3d0;border-color:#28795d}button.danger{color:#fecdd3;border-color:#874254}button:disabled{opacity:.45;cursor:not-allowed}input[type=password]{width:100%;background:#0a111e;border:1px solid #34435c;border-radius:10px;color:var(--text);padding:12px;text-align:center;letter-spacing:10px;font-size:24px}.gate button{width:100%;margin-top:12px}.error{color:#fecdd3;min-height:24px;margin-top:8px}.panel.main{padding:18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px}.item input{accent-color:var(--blue)}.item-main{min-width:0;flex:1}.item-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-actions{display:flex;gap:6px;flex-shrink:0}.empty{text-align:center;color:var(--muted);padding:42px 12px;border:1px dashed var(--line);border-radius:12px}.notice{margin:12px 0;padding:10px 12px;border-radius:10px;background:#102c27;color:#a7f3d0}.notice.bad{background:#351927;color:#fecdd3}.status{color:var(--yellow);font-size:12px}@media(max-width:560px){main{padding:18px 10px 40px}.top{align-items:flex-start;flex-direction:column}.item{align-items:flex-start;flex-wrap:wrap}.item-actions{width:100%;padding-right:28px}.item-actions button{flex:1}.bar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<section id="gate" class="panel gate">
<h1>الطلبات</h1><div class="muted">تسجيل الدخول</div>
<form id="login"><input id="pin" type="password" inputmode="numeric" maxlength="4" minlength="4" pattern="[0-9]{4}" aria-label="PIN" required><div id="loginError" class="error"></div><button class="primary">دخول</button></form>
</section>
<section id="app" class="hidden">
<div class="top"><div><h1>الطلبات</h1><div id="count" class="muted"></div></div><div class="actions"><button id="refresh">تحديث</button><button id="logout">خروج</button></div></div>
<div class="panel main">
<nav class="tabs" aria-label="الأقسام"><button class="tab active" data-folder="PENDING">معلقة</button><button class="tab" data-folder="OTHER">مهملة</button><button class="tab" data-folder="INBOX">الوارد</button></nav>
<div class="bar"><label class="check"><input id="all" type="checkbox"> تحديد الكل</label><div class="actions"><button id="bulkAccept" class="good" disabled>قبول</button><button id="bulkReject" class="danger" disabled>رفض</button></div></div>
<div id="notice" class="notice hidden"></div><div id="list" class="list"></div>
</div>
</section>
</main>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let folder="PENDING",items=[],selected=new Set();const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
function showNotice(text,bad=false){const n=$('#notice');n.textContent=text;n.className=bad?'notice bad':'notice';n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),3500)}
function updateSelection(){const valid=new Set(items.map(x=>x.threadID));selected=new Set([...selected].filter(x=>valid.has(x)));$('#all').checked=items.length>0&&selected.size===items.length;$('#bulkAccept').disabled=!selected.size;$('#bulkReject').disabled=!selected.size;$('#count').textContent=`${items.length} محادثة · ${selected.size} محددة`}
function render(){updateSelection();if(!items.length){$('#list').innerHTML='<div class="empty">لا توجد محادثات</div>';return}$('#list').innerHTML=items.map(x=>`<article class="item"><input type="checkbox" data-select="${esc(x.threadID)}" ${selected.has(x.threadID)?'checked':''}><div class="item-main"><div class="item-name">${esc(x.name||x.threadID)}</div><div class="item-sub">${x.isGroup?'مجموعة':'محادثة'}${x.snippet?' · '+esc(x.snippet):''}</div></div><div class="item-actions"><button class="good" data-action="accept" data-id="${esc(x.threadID)}">قبول</button><button class="danger" data-action="reject" data-id="${esc(x.threadID)}">رفض</button></div></article>`).join('');$$('[data-select]').forEach(e=>e.onchange=()=>{e.checked?selected.add(e.dataset.select):selected.delete(e.dataset.select);updateSelection()});$$('[data-action]').forEach(e=>e.onclick=()=>change(e.dataset.id,e.dataset.action))}
async function load(){try{const d=await api(`/api/requests?kind=message&folder=${folder}&limit=100`);items=d.messages?.items||[];selected.clear();render()}catch(e){showNotice(e.message,true);$('#list').innerHTML='<div class="empty">تعذر التحميل</div>'}}
async function change(id,action){try{await api(`/api/requests/messages/${encodeURIComponent(id)}/${action}`,{method:'POST'});showNotice(action==='accept'?'تم القبول':'تم الرفض');await load()}catch(e){showNotice(e.message,true)}}
async function bulk(action){const ids=[...selected];if(!ids.length)return;try{await api('/api/requests/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'message',action,ids})});showNotice(action==='accept'?'تم القبول':'تم الرفض');await load()}catch(e){showNotice(e.message,true)}}
async function unlock(){try{const d=await api('/api/dashboard/session');if(d.authenticated){$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');load()}}catch(e){$('#loginError').textContent=e.message}}
$('#login').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/dashboard/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('#pin').value})});$('#pin').value='';$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');load()}catch(e){$('#loginError').textContent=e.message;$('#pin').select()}};
$('#refresh').onclick=load;$('#bulkAccept').onclick=()=>bulk('accept');$('#bulkReject').onclick=()=>bulk('reject');$('#all').onchange=e=>{selected=e.target.checked?new Set(items.map(x=>x.threadID)):new Set();render()};$('#logout').onclick=async()=>{try{await api('/api/dashboard/logout',{method:'POST'})}finally{location.reload()}};$$('[data-folder]').forEach(e=>e.onclick=()=>{folder=e.dataset.folder;$$('[data-folder]').forEach(x=>x.classList.toggle('active',x===e));load()});unlock()})()
</script>
</body>
</html>
