<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Requests · SunkenBot</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111827;--panel2:#0d1422;--line:#253249;--text:#e5edf8;--muted:#8d9bb0;--blue:#4f8cff;--green:#36d399;--red:#f27791;--yellow:#f5c75b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172238 0,#090d16 58%);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:850px;margin:auto;padding:28px 15px 60px}.hidden{display:none!important}.panel{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 42px #0003}.gate{max-width:360px;margin:12vh auto 0;padding:24px}h1{font-size:23px;margin:0 0 4px}h2{font-size:16px;margin:0}.muted{color:var(--muted);font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs{border-bottom:1px solid var(--line);padding:0 2px;margin-bottom:14px}.tab{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:10px 12px}.tab.active{border-color:var(--blue);color:var(--text)}button,input{font:inherit}button{border:1px solid #35445c;background:#17243a;color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:650}button:hover{border-color:#5b78a5}button.primary{background:#245ec8;border-color:#4f8cff}button.good{color:#a7f3d0;border-color:#28795d}button.danger{color:#fecdd3;border-color:#874254}button:disabled{opacity:.45;cursor:not-allowed}input[type=password]{width:100%;background:#0a111e;border:1px solid #34435c;border-radius:10px;color:var(--text);padding:12px;font-size:18px}label.lbl{display:block;font-weight:650;margin:10px 0 6px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;max-width:420px}dialog::backdrop{background:#0008}[hidden]{display:none!important}.notice{white-space:pre-wrap}.gate button{width:100%;margin-top:12px}.error{color:#fecdd3;min-height:24px;margin-top:8px}.panel.main{padding:18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px}.item input{accent-color:var(--blue)}.item-main{min-width:0;flex:1}.item-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-actions{display:flex;gap:6px;flex-shrink:0}.empty{text-align:center;color:var(--muted);padding:42px 12px;border:1px dashed var(--line);border-radius:12px}.notice{margin:12px 0;padding:10px 12px;border-radius:10px;background:#102c27;color:#a7f3d0}.notice.bad{background:#351927;color:#fecdd3}.status{color:var(--yellow);font-size:12px}@media(max-width:560px){main{padding:18px 10px 40px}.top{align-items:flex-start;flex-direction:column}.item{align-items:flex-start;flex-wrap:wrap}.item-actions{width:100%;padding-right:28px}.item-actions button{flex:1}.bar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<section id="gate" class="panel gate hidden">
<h1>الطلبات</h1><div class="muted">تسجيل الدخول</div>
<form id="login"><label class="lbl" for="pw">كلمة المرور</label><input id="pw" type="password" minlength="12" autocomplete="current-password" required><div id="loginError" class="error" role="alert"></div><button type="submit" class="primary">دخول</button></form>
</section>
<section id="app" class="hidden">
<div class="top"><div><h1>الطلبات</h1><div id="count" class="muted" aria-live="polite"></div></div><div class="actions"><button id="refresh" type="button">تحديث</button><button id="logout" type="button">خروج</button></div></div>
<div class="panel main">
<div class="tabs" role="tablist" aria-label="الأقسام"><button type="button" role="tab" id="tab-pending" class="tab active" aria-selected="true" aria-controls="panel" data-folder="PENDING">معلقة</button><button type="button" role="tab" id="tab-other" class="tab" aria-selected="false" tabindex="-1" aria-controls="panel" data-folder="OTHER">مهملة</button><button type="button" role="tab" id="tab-inbox" class="tab" aria-selected="false" tabindex="-1" aria-controls="panel" data-folder="INBOX">الوارد</button></div>
<div id="panel" role="tabpanel" aria-labelledby="tab-pending">
<div class="bar"><label class="check"><input id="all" type="checkbox"> تحديد الكل</label><div class="actions"><button id="bulkAccept" type="button" class="good" disabled>قبول</button><button id="bulkReject" type="button" class="danger" disabled>رفض</button></div></div>
<div id="notice" class="notice" data-base="notice" hidden></div><div id="list" class="list"></div>
<div class="bar" style="margin-top:12px"><button id="more" type="button" hidden>تحميل المزيد</button></div>
</div>
</div>
</section>
</main>
<script src="/static/client.js"></script>
<script src="/static/requests.js"></script>
</body>
</html>
