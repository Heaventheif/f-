[package]
name = "sunken-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "sunken"
crate-type = ["cdylib"]

[dependencies]
scraper = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
url = "2"
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
