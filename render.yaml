services:
  - type: web
    name: xx-bot
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: bun install --production --frozen-lockfile
    startCommand: bun run start
    healthCheckPath: /health

    # Persistent disk — survives redeploys and auto-scaling restarts.
    # Prevents appState cookie loss that triggers Meta suspicious-login flags.
    disk:
      name: bot-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # 64-char hex key for AES-256-GCM appState encryption (auto-generated by Render)
      - key: APPSTATE_SECRET
        generateValue: true
      # Path inside the persistent disk — survives restarts
      - key: FB_STATE_PATH
        value: /app/data/appstate.enc
      # SQLite database on the persistent disk
      - key: DATABASE_URL
        value: sqlite:///app/data/bot.db
      # Max parallel command executions per process
      - key: MAX_CONCURRENT_COMMANDS
        value: "10"
      # تفعيل session keep-alive لتجديد AppState تلقائياً
      - key: FCA_ENABLE_KEEPALIVE
        value: "true"
      # Internal token for /yt/* routes — auto-generated
      - key: INTERNAL_TOKEN
        generateValue: true
      # Your Facebook appState JSON — set this manually in the Render dashboard
      - key: APPSTATE
        sync: false
      # مهلة بدء المزوّد البديل بالتوازي (مللي ثانية)
      - key: YT_HEDGE_MS
        value: "2000"
      # حدود معدل FCA (إن كانت المكتبة تقرأها) — قيم عالية = بلا خنق
      - key: FCA_RATE_UPLOAD
        value: "1000"
      - key: FCA_RATE_GRAPHQL
        value: "1000"
      - key: FCA_RATE_MERCURY
        value: "1000"
      - key: FCA_RATE_DEFAULT
        value: "1000"
      # فاصل اختياري (مللي ثانية) بين رفعتي وسائط في نفس المجموعة.
      # 0 = أسرع. إن تكررت رسالة "returned no metadata/ids" جرّب 400.
      - key: MEDIA_GAP_MS
        value: "0"
      # Downloader API hosted by the yy repository
      - key: API_URL
        value: https://yy-two-ruddy.vercel.app
      # TikTok search API hosted by the tS repository
      - key: TIKTOK_API
        value: https://heaventheif-ts.vercel.app
