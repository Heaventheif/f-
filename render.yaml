services:
  - type: web
    name: xx-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TMPDIR
        value: /tmp/sunkenbot-media
      - key: APPSTATE_SECRET
        generateValue: true
      - key: FB_STATE_PATH
        value: /tmp/appstate.enc
      - key: DATABASE_URL
        sync: false
      - key: PIN
        sync: false
      - key: MAX_CONCURRENT_COMMANDS
        value: "5"
      - key: MONITOR_INTERVAL_MIN
        value: "30"
      - key: PG_POOL_MAX
        value: "2"
      - key: FCA_ENABLE_KEEPALIVE
        value: "true"
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: BROADCAST_DATA_DIR
        value: /tmp/broadcast
      - key: BROADCAST_MAX_FILE_MB
        value: "50"
      - key: BROADCAST_MAX_TOTAL_MB
        value: "100"
      - key: BROADCAST_MAX_TARGETS
        value: "300"
      - key: APPSTATE
        sync: false
      - key: APPSTATE_FORCE_ENV
        value: "false"
      - key: HF_SPACE_URL
        value: https://kiyunhai-g.hf.space
      - key: TIKTOK_API_KEY
        sync: false
      - key: BETADASH_API_KEY
        sync: false
      - key: TUMBLR_API_KEY
        sync: false
      - key: FERDEV_API_KEY
        sync: false
      - key: YT_HEDGE_MS
        value: "2000"
      - key: FCA_RATE_UPLOAD
        value: "1000"
      - key: FCA_RATE_GRAPHQL
        value: "1000"
      - key: FCA_RATE_MERCURY
        value: "1000"
      - key: FCA_RATE_DEFAULT
        value: "1000"
      - key: MEDIA_GAP_MS
        value: "0"
      - key: API_URL
        value: https://yy-two-ruddy.vercel.app
      - key: TIKTOK_API
        value: https://heaventheif-ts.vercel.app
