services:
  - type: web
    name: xx-bot
    # الكود يعتمد على Bun (Bun.serve / Bun.file) وهو غير متوفر في runtime: node،
    # لذلك النشر عبر Docker (oven/bun) كما في Dockerfile.
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TMPDIR
        value: /tmp/sunkenbot-media
      # 64-char hex key for AES-256-GCM appState encryption (auto-generated by Render)
      - key: APPSTATE_SECRET
        generateValue: true
      # Local file is only a fallback on Render Free; Neon is the durable source.
      - key: FB_STATE_PATH
        value: /tmp/appstate.enc
      # Configure the Neon PostgreSQL connection in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Set a private four-digit PIN in the Render dashboard (never commit its value).
      - key: PIN
        sync: false
      # Max parallel command executions per process
      - key: MAX_CONCURRENT_COMMANDS
        value: "10"
      # تفعيل session keep-alive لتجديد AppState تلقائياً
      - key: FCA_ENABLE_KEEPALIVE
        value: "true"
      # Internal token for /yt/* routes — auto-generated
      - key: INTERNAL_TOKEN
        generateValue: true
      # Writable temporary path for Render Free; PostgreSQL stores campaign metadata.
      # Uploaded files remain ephemeral and require external object storage for durability.
      - key: BROADCAST_DATA_DIR
        value: /tmp/broadcast
      - key: BROADCAST_MAX_FILE_MB
        value: "50"
      - key: BROADCAST_MAX_TOTAL_MB
        value: "100"
      - key: BROADCAST_MAX_TARGETS
        value: "300"
      # Your Facebook appState JSON — set this manually in the Render dashboard
      - key: APPSTATE
        sync: false
      # اضبطه على true لإقلاع واحد فقط إذا وضعت APPSTATE جديداً ولم يُطبَّق
      # (يتجاوز النسخة المخزَّنة في قاعدة البيانات). أعده إلى false بعد ذلك.
      - key: APPSTATE_FORCE_ENV
        value: "false"

      # ── مفاتيح خدمات خارجية (اختيارية — الأمر المرتبط يتعطل بدونها) ──
      - key: HF_SPACE_URL
        sync: false
      - key: TIKTOK_API_KEY
        sync: false
      - key: BETADASH_API_KEY
        sync: false
      - key: TUMBLR_API_KEY
        sync: false
      - key: FERDEV_API_KEY
        sync: false
      # مهلة بدء المزوّد البديل بالتوازي (مللي ثانية)
      - key: YT_HEDGE_MS
        value: "2000"
      # حدود معدل FCA (إن كانت المكتبة تقرأها) — قيم عالية = بلا خنق
      - key: FCA_RATE_UPLOAD
        value: "1000"
      - key: FCA_RATE_GRAPHQL
        value: "1000"
      - key: FCA_RATE_MERCURY
        value: "1000"
      - key: FCA_RATE_DEFAULT
        value: "1000"
      # فاصل اختياري (مللي ثانية) بين رفعتي وسائط في نفس المجموعة.
      # 0 = أسرع. إن تكررت رسالة "returned no metadata/ids" جرّب 400.
      - key: MEDIA_GAP_MS
        value: "0"
      # Downloader API hosted by the yy repository
      - key: API_URL
        value: https://yy-two-ruddy.vercel.app
      # TikTok search API hosted by the tS repository
      - key: TIKTOK_API
        value: https://heaventheif-ts.vercel.app
      # دوال Rust معطّلة حتى يثبت bench-rust.js مكسبها. أزل من القائمة ما ثبت أنه رابح.
      - key: DISABLE_RUST_FNS
        value: "match_chapter,split_message,clean_text,is_filtered"
